[package]
name = "pes"
version = "0.1.0"
description = "PES embroidery design editor"
authors = ["Pom"]
edition = "2021"

[lib]
name = "pes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cxx-build = "1"
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cxx = "1"
